name: Desktop App Checks

on:
  push:
    branches: [c2-stabilization]
  pull_request:
    branches: [c2]

permissions:
  contents: read

jobs:
  linux:
    name: Linux Mint / Ubuntu desktop compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build frontend with desktop asset paths
        run: npm run build
        env:
          TAURI_ENV_PLATFORM: linux
      - name: Compile Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml

  windows:
    name: Windows desktop compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build frontend with desktop asset paths
        run: npm run build
        env:
          TAURI_ENV_PLATFORM: windows
      - name: Compile Tauri shell
        run: cargo check --manifest-path src-tauri/Cargo.toml
