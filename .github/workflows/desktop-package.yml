name: Build Desktop Installers

on:
  push:
    branches: [c2-stabilization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deb:
    name: Linux Mint / Ubuntu DEB installer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build Linux DEB installer
        run: npm run desktop:build -- --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: dhaka-world-builder-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  windows-nsis:
    name: Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install NSIS
        run: choco install nsis --no-progress --yes
      - run: npm ci
      - name: Build Windows installer
        run: npm run desktop:build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: dhaka-world-builder-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
